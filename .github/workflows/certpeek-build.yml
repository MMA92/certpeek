name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            xorg-dev \
            pkg-config

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/certpeek-linux-amd64 .

      - name: Package tarball
        run: |
          tar -czf dist/certpeek-linux-amd64.tar.gz -C dist certpeek-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: certpeek-linux-amd64
          path: dist/certpeek-linux-amd64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/certpeek-linux-amd64
            dist/certpeek-linux-amd64.tar.gz
          generate_release_notes: true
